---
layout: default
---
<main class="page-frame post-page">
  <p class="back-link"><a href="{{ '/blog/' | relative_url }}">← Blog</a></p>
  <article>
    <header class="post-header">
      <h1>{{ page.title }}</h1>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
  </article>
</main>
