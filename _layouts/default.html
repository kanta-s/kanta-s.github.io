<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#f7f5ef">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="header-inner">
          <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Kanta Sato home">
            <span>KS</span><i aria-hidden="true"></i>
          </a>
          <nav class="main-nav" aria-label="Main navigation">
            <a href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>Home</a>
            <a href="{{ '/resume/' | relative_url }}"{% if page.nav == 'resume' %} aria-current="page"{% endif %}>Resume</a>
          </nav>
        </div>
      </header>

      {{ content }}

      <footer class="site-footer">
        <div class="footer-inner">
          <p>© {{ 'now' | date: '%Y' }} Kanta Sato</p>
          <p lang="ja">English / 日本語</p>
        </div>
      </footer>
    </div>
  </body>
</html>
