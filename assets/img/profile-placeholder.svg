<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Kanta Sato profile photo placeholder</title>
  <desc id="desc">A blue-gray circular placeholder with the initials KS.</desc>
  <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eef2f8"/><stop offset="1" stop-color="#d9e1ef"/></linearGradient></defs>
  <circle cx="200" cy="200" r="199" fill="url(#g)" stroke="#b8c3d9" stroke-width="2"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#2858c7" stroke-opacity=".18" stroke-width="2"/>
  <text x="200" y="225" fill="#30466e" font-family="Georgia, serif" font-size="100" text-anchor="middle">KS</text>
  <text x="200" y="285" fill="#6e7e99" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="8" text-anchor="middle">PHOTO</text>
</svg>
